# SQLite via io.quarkiverse.jdbc:quarkus-jdbc-sqlite (registriert org.xerial:sqlite-jdbc + Hibernate SQLiteDialect).
# SQLite erlaubt nur einen Writer gleichzeitig -> Pool auf eine Connection fixieren, WAL-Modus fuer bessere Concurrency.
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/data/reunion.db?journal_mode=WAL&busy_timeout=5000
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.schema-management.strategy=update

%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${java.io.tmpdir}/reunion-test.db?journal_mode=WAL&busy_timeout=5000
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
